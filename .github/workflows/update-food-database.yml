name: Update food database
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-food-database.yml"
      - "requirements.txt"
      - "scripts/update_food_database.py"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python scripts/update_food_database.py --download
      - name: Commit normalized updates
        run: |
          if git diff --quiet -- public-site/data/foods.json; then exit 0; fi
          git config user.name "nutrition-data-bot"
          git config user.email "nutrition-data-bot@users.noreply.github.com"
          git add public-site/data/foods.json
          git commit -m "update normalized food database"
          git push
