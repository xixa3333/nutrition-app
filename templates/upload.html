<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上傳食物 - 食物營養紀錄系統</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload.css') }}">
</head>
<body>
    <!-- 統一導航列 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">🍽️ 營養紀錄系統</div>
            <ul class="nav-menu">
                <li><a href="/home.html">首頁</a></li>
                <li><a href="/diary.html">飲食日記</a></li>
                <li><a href="/profile.html">個人資料</a></li>
                <li><a href="/upload.html" class="active">上傳食物</a></li>
                {% if is_admin %}
                <li><a href="/review.html">審核管理</a></li>
                {% endif %}
                <li><a href="/logout" class="logout-btn">登出</a></li>
            </ul>
            <div class="nav-user">👤 {{ name }}</div>
        </div>
    </nav>

    <div class="container">
        <h1>上傳新食物</h1>

        <!-- 上傳表單 -->
        <div class="upload-section">
            <form id="uploadForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>食物名稱 *</label>
                        <input type="text" id="foodName" required>
                    </div>
                    <div class="form-group">
                        <label>分類 *</label>
                        <select id="foodCategory" required>
                            <option value="">請選擇</option>
                            <option value="主食">主食</option>
                            <option value="蔬菜">蔬菜</option>
                            <option value="水果">水果</option>
                            <option value="肉類">肉類</option>
                            <option value="海鮮">海鮮</option>
                            <option value="乳製品">乳製品</option>
                            <option value="飲料">飲料</option>
                            <option value="零食">零食</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>熱量 (kcal) *</label>
                        <input type="number" id="calories" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>蛋白質 (g) *</label>
                        <input type="number" id="protein" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>脂肪 (g) *</label>
                        <input type="number" id="fat" step="0.1" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>碳水化合物 (g) *</label>
                        <input type="number" id="carbs" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>膳食纖維 (g) *</label>
                        <input type="number" id="fiber" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>單位 (g) *</label>
                        <input type="text" id="unit" value="100g" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>描述</label>
                    <textarea id="description" rows="3"></textarea>
                </div>

                <button type="submit" class="btn-submit">📤 上傳食物</button>
            </form>
        </div>

        <!-- 我的上傳紀錄 -->
        <div class="my-uploads">
            <h2>我的上傳紀錄</h2>
            <div class="upload-list" id="uploadList">
                <p class="no-data">載入中...</p>
            </div>
        </div>
    </div>

    <script>
        // 載入我的上傳
        async function loadMyUploads() {
            try {
                const response = await fetch('/api/foods/my');
                const foods = await response.json();
                displayMyUploads(foods);
            } catch (error) {
                console.error('載入失敗:', error);
            }
        }

        function displayMyUploads(foods) {
            const list = document.getElementById('uploadList');
            
            if (!foods || foods.length === 0) {
                list.innerHTML = '<p class="no-data">尚無上傳紀錄</p>';
                return;
            }

            list.innerHTML = foods.map(food => {
                const statusClass = food.approval_status === 0 ? 'status-pending' : 
                                   food.approval_status === 1 ? 'status-approved' : 'status-rejected';
                const statusText = food.approval_status === 0 ? '審核中' : 
                                  food.approval_status === 1 ? '已通過' : '未通過';
                
                return `
                    <div class="upload-item">
                        <div class="upload-info">
                            <h4>${food.name} <span class="status-badge ${statusClass}">${statusText}</span></h4>
                            <p>分類：${food.category} | 熱量：${food.calories} kcal</p>
                            <p>上傳日期：${food.date}</p>
                        </div>
                        ${food.approval_status === 0 ? 
                            `<button class="btn-cancel" onclick="cancelUpload(${food.id})">取消</button>` : 
                            ''}
                    </div>
                `;
            }).join('');
        }

        // 提交上傳
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const foodData = {
                name: document.getElementById('foodName').value,
                category: document.getElementById('foodCategory').value,
                calories: parseFloat(document.getElementById('calories').value),
                protein: parseFloat(document.getElementById('protein').value),
                fat: parseFloat(document.getElementById('fat').value),
                carbs: parseFloat(document.getElementById('carbs').value),
                fiber: parseFloat(document.getElementById('fiber').value),
                unit: document.getElementById('unit').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch('/api/foods/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(foodData)
                });

                const result = await response.json();
                if (result.success) {
                    alert('✅ ' + result.message);
                    document.getElementById('uploadForm').reset();
                    loadMyUploads();
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) {
                alert('❌ 系統錯誤');
            }
        });

        // 取消上傳
        async function cancelUpload(foodId) {
            if (!confirm('確定要取消此上傳嗎？')) return;

            try {
                const response = await fetch('/api/foods/cancel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ food_id: foodId })
                });

                const result = await response.json();
                if (result.success) {
                    alert('✅ 已取消上傳');
                    loadMyUploads();
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) {
                alert('❌ 系統錯誤');
            }
        }

        window.addEventListener('DOMContentLoaded', loadMyUploads);
    </script>
</body>
</html>
