<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食刻營養</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="/">食刻營養</a><nav aria-label="主要導覽"><button class="on" data-page="home">探索食物</button><button data-page="diary">飲食日記</button><button data-page="profile">健康設定</button><button data-page="upload">提交食物</button><button data-page="review" class="admin-only">管理審核</button></nav><div class="account"><span id="who">訪客</span><a id="identity" href="/signin-with-chatgpt?return_to=/">可信登入</a></div></header>
<main><section id="home" class="page active"><div class="hero"><p class="eyebrow">可靠的營養選擇</p><h1>每一餐，都更接近你的目標。</h1><p>搜尋正規化食物資料、記錄每日攝取，依活動量與增肌／維持／減脂目標自動計算並推薦。</p><div class="today-card"><span>今日攝取</span><b id="todayKcal">0</b><small>kcal</small><div class="progress"><i id="kcalBar"></i></div><p id="goalText">登入後自動計算</p></div></div><div class="toolbar"><input id="foodQuery" type="search" placeholder="搜尋食物名稱" aria-label="搜尋食物"><select id="category" aria-label="食物分類"><option value="">全部分類</option></select><span id="foodCount"></span></div><div id="foodGrid" class="food-grid"></div></section>
<section id="diary" class="page"><div class="section-head"><div><p class="eyebrow">每日追蹤</p><h2>飲食日記與推薦</h2></div><input id="diaryDate" type="date" aria-label="紀錄日期"></div><div class="metric-grid"><article><span>熱量</span><b id="mKcal">0</b><small>kcal</small></article><article><span>蛋白質</span><b id="mProtein">0</b><small>g</small></article><article><span>脂肪</span><b id="mFat">0</b><small>g</small></article><article><span>碳水</span><b id="mCarb">0</b><small>g</small></article></div><div id="diaryList" class="list"></div><h3>為你推薦</h3><p id="recommendSummary"></p><div id="recommendations" class="food-grid"></div></section>
<section id="profile" class="page"><div class="section-head"><div><p class="eyebrow">健康設定</p><h2>個人資料與自動目標</h2></div><span id="accountEmail"></span></div><form id="profileForm" class="card form"><label>顯示名稱<input name="nickname" required></label><label>年齡<input name="age" type="number" min="1" max="120" required></label><label>性別<select name="gender" required><option value="">請選擇</option><option>男性</option><option>女性</option><option>其他</option></select></label><label>身高（cm）<input name="height" type="number" step=".1" min="80" max="250" required></label><label>體重（kg）<input name="weight" type="number" step=".1" min="20" max="400" required></label><label>活動量<select name="activity_level" required><option value="sedentary">久坐（幾乎不運動）</option><option value="light">輕度（每週 1–3 天）</option><option value="moderate">中度（每週 3–5 天）</option><option value="high">高度（每週 6–7 天）</option><option value="very_high">非常高（高強度工作／訓練）</option></select></label><label>飲食目標<select name="goal_type" required><option value="lose">減脂</option><option value="maintain">維持</option><option value="gain">增肌</option></select></label><label class="wide">過敏原（逗號分隔）<input name="allergens" placeholder="例如：奶類、花生、甲殼類"></label><div class="wide target-panel"><h3>系統自動計算目標</h3><div class="metric-grid"><article><span>每日熱量</span><b id="targetCalories">—</b><small>kcal</small></article><article><span>蛋白質</span><b id="targetProtein">—</b><small>g</small></article><article><span>脂肪</span><b id="targetFat">—</b><small>g</small></article><article><span>碳水</span><b id="targetCarb">—</b><small>g</small></article></div><p id="targetDetail"></p></div><button class="primary wide">儲存並重新計算</button></form></section>
<section id="upload" class="page"><div class="section-head"><div><p class="eyebrow">協作食物資料</p><h2>提交新食物</h2></div></div><form id="foodForm" class="card form"><label>食物名稱<input name="name" required></label><label>分類<input name="category" required></label><label>營養單位<input name="unit" value="100g" required></label><label>熱量（kcal）<input name="calorie" type="number" min="0" step=".1" required></label><label>蛋白質（g）<input name="protein" type="number" min="0" step=".1" required></label><label>脂肪（g）<input name="fat" type="number" min="0" step=".1" required></label><label>碳水（g）<input name="carb" type="number" min="0" step=".1" required></label><label>膳食纖維（g）<input name="fiber" type="number" min="0" step=".1" required></label><label class="wide">描述<textarea name="description"></textarea></label><label class="wide">過敏原<input name="allergens"></label><button class="primary wide">送出審核</button></form><h3>我的提交</h3><div id="myFoods" class="list"></div></section>
<section id="review" class="page"><div class="section-head"><div><p class="eyebrow">管理者專區</p><h2>待審核食物</h2></div><button id="syncFoods" class="primary">同步網路食物資料</button></div><p class="notice">只有管理者可以審核提交與觸發資料同步。</p><div id="pendingFoods" class="list"></div></section></main><div id="toast" role="status" aria-live="polite"></div><script type="module" src="/app.js"></script></body></html>
