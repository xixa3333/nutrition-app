<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="食刻－飲食營養管理與個人化推薦"><title>食刻｜飲食營養管理</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="#home"><b>食</b><span>食刻<small>營養管理</small></span></a><nav id="nav"><button data-page="home">首頁</button><button data-page="diary">飲食日記</button><button data-page="profile">個人資料</button><button data-page="upload">食品投稿</button><button data-page="review" class="admin">審核管理</button></nav><div class="user"><span id="who">訪客</span><button id="identity">設定身分</button></div></header>
<main>
<section id="home" class="page active"><div class="hero"><div><p class="eyebrow">今天也好好吃飯</p><h1>每一口，都更了解自己。</h1><p>搜尋食物、記錄每餐營養，依照身體資料與過敏原獲得更合適的飲食建議。</p><div class="search"><input id="foodQuery" placeholder="搜尋食品名稱或分類"><select id="category"><option value="">全部分類</option></select></div></div><div class="summary"><p>今日攝取</p><strong><span id="todayKcal">0</span> <small>kcal</small></strong><div class="progress"><i id="kcalBar"></i></div><p id="goalText">目標 2,000 kcal</p></div></div><div class="section-head"><div><p class="eyebrow">食品資料庫</p><h2>找到今天吃的食物</h2></div><span id="foodCount"></span></div><div id="foodGrid" class="food-grid"></div></section>
<section id="diary" class="page"><div class="section-head"><div><p class="eyebrow">每日紀錄</p><h2>飲食日記</h2></div><input type="date" id="diaryDate"></div><div class="metric-grid"><article><span>熱量</span><b id="mKcal">0</b><small>kcal</small></article><article><span>蛋白質</span><b id="mProtein">0</b><small>g</small></article><article><span>脂肪</span><b id="mFat">0</b><small>g</small></article><article><span>碳水</span><b id="mCarb">0</b><small>g</small></article></div><div id="diaryList" class="list"></div><div class="recommend"><h3>今日飲食建議</h3><div id="recommendations">記錄餐點後，系統會根據營養攝取提供建議。</div></div></section>
<section id="profile" class="page"><div class="section-head"><div><p class="eyebrow">健康設定</p><h2>個人資料</h2></div></div><form id="profileForm" class="card form"><label>顯示名稱<input name="nickname" required></label><label>年齡<input name="age" type="number" min="1" max="120"></label><label>性別<select name="gender"><option value="">未設定</option><option>男性</option><option>女性</option><option>其他</option></select></label><label>身高（cm）<input name="height" type="number" step=".1"></label><label>體重（kg）<input name="weight" type="number" step=".1"></label><label>每日熱量目標<input name="calorie_goal" type="number" value="2000"></label><label class="wide">過敏原（以逗號分隔）<input name="allergens" placeholder="例如：牛奶、花生、甲殼類"></label><button class="primary wide">儲存個人資料</button></form></section>
<section id="upload" class="page"><div class="section-head"><div><p class="eyebrow">社群食品庫</p><h2>投稿新食品</h2></div></div><form id="foodForm" class="card form"><label>食品名稱<input name="name" required></label><label>分類<input name="category" required></label><label>份量單位<input name="unit" value="100g" required></label><label>熱量（kcal）<input name="calorie" type="number" step=".1" required></label><label>蛋白質（g）<input name="protein" type="number" step=".1" required></label><label>脂肪（g）<input name="fat" type="number" step=".1" required></label><label>碳水（g）<input name="carb" type="number" step=".1" required></label><label>膳食纖維（g）<input name="fiber" type="number" step=".1" required></label><label class="wide">描述<textarea name="description"></textarea></label><label class="wide">過敏原<input name="allergens"></label><button class="primary wide">送出審核</button></form><h3>我的投稿</h3><div id="myFoods" class="list"></div></section>
<section id="review" class="page"><div class="section-head"><div><p class="eyebrow">管理工具</p><h2>待審核食品</h2></div></div><p class="notice">管理員審核碼由網站管理者在部署環境中設定，不會儲存在瀏覽器或程式碼。</p><label class="admin-key">管理員審核碼<input id="adminKey" type="password"></label><div id="pendingFoods" class="list"></div></section>
</main><dialog id="identityDialog"><form method="dialog" id="identityForm"><h2>設定使用身分</h2><p>資料會安全保存於雲端資料庫；此代號用來區分每位使用者。</p><label>使用者代號<input id="userCode" required minlength="3" maxlength="40" autocomplete="username"></label><label>顯示名稱<input id="displayName" required maxlength="40"></label><div><button value="cancel">取消</button><button value="default" class="primary">開始使用</button></div></form></dialog><div id="toast"></div><script src="/app.js"></script></body></html>
